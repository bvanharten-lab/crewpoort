<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CREW Poort 2027</title>
<script src="config.js"></script>
</head>
<body>
<title>CREW Poort 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Big+Shoulders+Display:wght@600;700;800&family=Epilogue:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap">
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f3f4f2;--line:#1b1f1d;--ink:#182420;--muted:#5d6b65;--hero:#1f2d2a;--hero-ink:#ffffff;--logo:#1f6f5f;--logo-ink:#ffffff;--sand:#e9e4d8;--sand-ink:#1b1f1d;--field:#eef1f6;
  --accent:#1f6f5f;--accent-ink:#ffffff;--accent-soft:#dcebe6;
  --ok:#2c7a4b;--ok-soft:#d9eedf;--warn:#a9711a;--warn-soft:#f6e9cf;--bad:#a8402f;--bad-soft:#f3dcd6;--pot:#4a5fa8;--pot-soft:#e0e5f5;--off:#8b958f;
  --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121917;--panel:#1a2320;--panel2:#22302b;--line:#5a6b65;--ink:#e6ece9;--muted:#98a7a1;--hero:#0e1513;--hero-ink:#ffffff;--logo:#4fb39b;--logo-ink:#0d1a16;--sand:#3a4440;--sand-ink:#ffffff;--field:#22302b;
  --accent:#4fb39b;--accent-ink:#0d1a16;--accent-soft:#1e3b34;
  --ok:#5fc182;--ok-soft:#1d3a29;--warn:#e0a94a;--warn-soft:#3d3018;--bad:#e07a68;--bad-soft:#3f2320;--pot:#8fa0e0;--pot-soft:#232c48;--off:#6d7a74;}}
:root[data-theme="dark"]{
  --bg:#121917;--panel:#1a2320;--panel2:#22302b;--line:#5a6b65;--ink:#e6ece9;--muted:#98a7a1;--hero:#0e1513;--hero-ink:#ffffff;--logo:#4fb39b;--logo-ink:#0d1a16;--sand:#3a4440;--sand-ink:#ffffff;--field:#22302b;
  --accent:#4fb39b;--accent-ink:#0d1a16;--accent-soft:#1e3b34;
  --ok:#5fc182;--ok-soft:#1d3a29;--warn:#e0a94a;--warn-soft:#3d3018;--bad:#e07a68;--bad-soft:#3f2320;--pot:#8fa0e0;--pot-soft:#232c48;--off:#6d7a74;}

/* ---- Merklagen: 4M (mannen) en Arise (vrouwen). Neutraal = kantoor / LIFE. ---- */
/* 4M — Big Shoulders Display (koppen), Epilogue (tekst), rood #DD0000, verder zwart/wit */
:root[data-brand="4M"]{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f4f4;--line:#111111;--ink:#000000;--muted:#555555;--hero:#0f0f0f;--hero-ink:#ffffff;--logo:#dd0000;--logo-ink:#ffffff;--sand:#e9e4d8;--sand-ink:#111111;--field:#eef1f6;
  --accent:#dd0000;--accent-ink:#ffffff;--accent-soft:#fbe0e0;--pot:#000000;--pot-soft:#ececec;
  --display:"Big Shoulders Display","Barlow Condensed",Impact,sans-serif;--body:"Epilogue","IBM Plex Sans",system-ui,sans-serif;}
:root[data-brand="4M"] h1{font-weight:800}
:root[data-brand="4M"] h2{font-weight:700;text-transform:uppercase;letter-spacing:.02em}
:root[data-brand="4M"] .row .lab,:root[data-brand="4M"] .roltab th{font-weight:700}
:root[data-brand="4M"] button.primary{background:var(--accent);border-color:var(--accent)}
:root[data-brand="4M"] .hero h1{font-size:clamp(40px,7vw,72px)}
@media (prefers-color-scheme:dark){:root[data-brand="4M"]:not([data-theme="light"]){--bg:#000000;--panel:#111111;--panel2:#1f1f1f;--line:#777777;--ink:#ffffff;--muted:#a8a8a8;--hero:#000000;--hero-ink:#ffffff;--logo:#dd0000;--logo-ink:#ffffff;--sand:#2a2a2a;--sand-ink:#ffffff;--field:#1f1f1f;--accent:#ff1a1a;--accent-ink:#ffffff;--accent-soft:#3a0e0e;--pot:#ffffff;--pot-soft:#2a2a2a;}}
:root[data-brand="4M"][data-theme="dark"]{--bg:#000000;--panel:#111111;--panel2:#1f1f1f;--line:#777777;--ink:#ffffff;--muted:#a8a8a8;--hero:#000000;--hero-ink:#ffffff;--logo:#dd0000;--logo-ink:#ffffff;--sand:#2a2a2a;--sand-ink:#ffffff;--field:#1f1f1f;--accent:#ff1a1a;--accent-ink:#ffffff;--accent-soft:#3a0e0e;--pot:#ffffff;--pot-soft:#2a2a2a;}
/* Arise — Playfair Display (koppen), Lato (tekst), bordeaux #6A3C3F en goud #A99F71 */
:root[data-brand="AR"]{--bg:#fcfaf7;--panel:#ffffff;--panel2:#f7f3ee;--line:#6a3c3f;--ink:#3a3032;--muted:#8a7c7e;--hero:#fcfaf7;--hero-ink:#5a3f42;--logo:#a99f71;--logo-ink:#ffffff;--sand:#a99f71;--sand-ink:#ffffff;--field:#ffffff;--border:#e6ddd2;
  --accent:#6a3c3f;--accent-ink:#ffffff;--accent-soft:#f5ecea;--gold:#c2b996;--pot:#7d7449;--pot-soft:#ecE8d8;--border:#ece5dc;--shadow:0 1px 2px rgba(74,46,49,.04),0 6px 20px rgba(74,46,49,.05);
  --display:"Playfair Display",Georgia,serif;--body:"Lato","IBM Plex Sans",system-ui,sans-serif;}
:root[data-brand="AR"] h1,:root[data-brand="AR"] h2{text-transform:none;letter-spacing:0;font-weight:600}
:root[data-brand="AR"] h1{font-weight:400;font-size:clamp(30px,4.5vw,44px);color:var(--accent);font-style:italic}
:root[data-brand="AR"] .hero h1:after{height:2px;width:72px;background:var(--gold)}
:root[data-brand="AR"] .hero .sub{opacity:.8;color:var(--hero-ink)}
:root[data-brand="AR"] .site{border-bottom:0}
:root[data-brand="AR"] .hero .in{padding-top:12px;padding-bottom:44px}
:root[data-brand="AR"] .logo{background:transparent;padding:0}
:root[data-brand="AR"] .steps button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--hero-ink);opacity:.65;font-weight:700;letter-spacing:.06em;font-size:12px}
:root[data-brand="AR"] .steps button.on{opacity:1;border-bottom-color:var(--accent);border-bottom-width:2px}
:root[data-brand="AR"] .who select,:root[data-brand="AR"] .who button{background:var(--panel);color:var(--ink);border-color:var(--border)}
:root[data-brand="AR"] .who label{color:var(--hero-ink)}
:root[data-brand="AR"] .panel{border-top:0;border:1px solid var(--border);box-shadow:none;padding-top:18px}
:root[data-brand="AR"] .panel>h2{font-size:21px;color:var(--accent);font-weight:500}
:root[data-brand="AR"] .userbox .t{text-transform:none;font-weight:600;font-size:20px}
:root[data-brand="AR"] .userbox .t,:root[data-brand="AR"] .intro b{color:var(--accent)}
:root[data-brand="AR"] button{border-width:1px;border-color:var(--accent);color:var(--accent);background:transparent;letter-spacing:.08em;border-radius:2px}
:root[data-brand="AR"] button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-brand="AR"] .row .lab{font-weight:600}
:root[data-brand="AR"] .row{border-bottom-color:var(--panel2)}
:root[data-brand="AR"] button.small{border-color:var(--border);color:var(--ink)}
:root[data-brand="AR"] .note{border-left-color:var(--gold);background:var(--panel2)}
:root[data-brand="AR"] th{border-bottom:1px solid var(--gold);color:var(--muted)}
:root[data-brand="AR"] .stat{background:var(--panel2)}
:root[data-brand="AR"] .sw input:checked+i{background:var(--accent)}
:root[data-brand="AR"] .userbox,:root[data-brand="AR"] .intro{border:1px solid var(--border);box-shadow:none}
:root[data-brand="AR"] h3,:root[data-brand="AR"] th,:root[data-brand="AR"] .stat .l,:root[data-brand="AR"] .field>span,:root[data-brand="AR"] .tag,:root[data-brand="AR"] .who label,:root[data-brand="AR"] .slot .r,:root[data-brand="AR"] .slotrow .r{font-family:var(--body);font-weight:700;letter-spacing:.08em;font-size:12px}
:root[data-brand="AR"] .steps button{font-family:var(--body)}
:root[data-brand="AR"] .tag.lbl{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme:dark){:root[data-brand="AR"]:not([data-theme="light"]){--bg:#1b1617;--panel:#251e20;--panel2:#31292b;--line:#8a6f72;--ink:#efe9e6;--muted:#aa9c9a;--hero:#3f2325;--hero-ink:#ffffff;--logo:#a99f71;--logo-ink:#1b1617;--sand:#a99f71;--sand-ink:#1b1617;--field:#31292b;--accent:#b9777b;--accent-ink:#1b1617;--accent-soft:#3f2a2c;--gold:#c2b78a;--pot:#c2b78a;--pot-soft:#332f22;}}
:root[data-brand="AR"][data-theme="dark"]{--bg:#1b1617;--panel:#251e20;--panel2:#31292b;--line:#8a6f72;--ink:#efe9e6;--muted:#aa9c9a;--hero:#3f2325;--hero-ink:#ffffff;--logo:#a99f71;--logo-ink:#1b1617;--sand:#a99f71;--sand-ink:#1b1617;--field:#31292b;--accent:#b9777b;--accent-ink:#1b1617;--accent-soft:#3f2a2c;--gold:#c2b78a;--pot:#c2b78a;--pot-soft:#332f22;}
/* LIFE — lifenetwerk.nl: Big Shoulders Display 800 (koppen), Epilogue (tekst), zwart, rood #DD0000, donkerblauw #0D3E5D, lichtgrijs #F0F0F0 */
:root[data-brand="LI"]{--bg:#f0f0f0;--panel:#ffffff;--panel2:#f4f4f4;--line:#1d1d1d;--ink:#1d1d1d;--muted:#555555;--hero:#000000;--hero-ink:#ffffff;--logo:#dd0000;--logo-ink:#ffffff;--sand:#0d3e5d;--sand-ink:#ffffff;--field:#f0f0f0;
  --accent:#dd0000;--accent-ink:#ffffff;--accent-soft:#fbe0e0;--pot:#0d3e5d;--pot-soft:#e3ecf2;
  --display:"Big Shoulders Display","Barlow Condensed",Impact,sans-serif;--body:"Epilogue","IBM Plex Sans",system-ui,sans-serif;}
:root[data-brand="LI"] h1{font-weight:800}
:root[data-brand="LI"] h2{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
:root[data-brand="LI"] .steps button.on{border-bottom-color:var(--accent)}
:root[data-brand="LI"] button.primary{background:var(--accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root[data-brand="LI"]:not([data-theme="light"]){--bg:#0e0e0e;--panel:#1a1a1a;--panel2:#262626;--line:#6a6a6a;--ink:#f0f0f0;--muted:#a8a8a8;--hero:#000000;--sand:#0d3e5d;--sand-ink:#ffffff;--field:#262626;--accent:#ff1a1a;--accent-soft:#3a0e0e;--pot:#9fc2dd;--pot-soft:#1c2b36;}}
:root[data-brand="LI"][data-theme="dark"]{--bg:#0e0e0e;--panel:#1a1a1a;--panel2:#262626;--line:#6a6a6a;--ink:#f0f0f0;--muted:#a8a8a8;--hero:#000000;--sand:#0d3e5d;--sand-ink:#ffffff;--field:#262626;--accent:#ff1a1a;--accent-soft:#3a0e0e;--pot:#9fc2dd;--pot-soft:#1c2b36;}
.brandtag{display:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;padding:0}
:root{--shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.07);--r:6px;--border:#e2e2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--border:#333;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,60px);font-weight:700;text-transform:uppercase;line-height:1;color:var(--hero-ink)}
h2{font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* site header zoals 4m.nl: donkere balk, logo-blok links, navigatie rechts */
.site{background:var(--hero);color:var(--hero-ink);padding-top:env(safe-area-inset-top,0px)}
.site .in{max-width:1040px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:#fff;padding:6px 10px;line-height:0;display:inline-flex;align-items:center}
.logo img{height:40px;width:auto;display:block}
:root[data-brand="4M"] .logo{padding:0;background:transparent}
:root[data-brand="4M"] .logo img{height:52px}
:root[data-brand="AR"] .logo img{height:56px}
.logo:has(img[alt="Coalition:58"]){padding:10px 16px}
.logo img[alt="Coalition:58"]{height:28px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.steps button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;font-size:14px;font-weight:700;color:var(--hero-ink);opacity:.75;text-transform:uppercase;letter-spacing:.04em}
.steps button:hover{opacity:1}
.steps button:disabled{opacity:.35;cursor:not-allowed}
.steps button.on{opacity:1;border-bottom-color:var(--logo);border-bottom-width:3px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--hero-ink)}
.who label{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.who select,.who button{background:rgba(255,255,255,.12);color:var(--hero-ink);border-color:rgba(255,255,255,.25)}
.who option{color:#000}
.hero{background:var(--hero);color:var(--hero-ink)}
.hero .in{max-width:1040px;margin:0 auto;padding:36px 16px 56px}
.hero h1{position:relative;padding-bottom:14px}
.hero h1:after{content:"";position:absolute;left:0;bottom:0;width:56px;height:5px;background:var(--logo)}
.hero .sub{margin-top:10px;opacity:.75;font-size:14px}
select,button,input,textarea{font:inherit;color:var(--ink)}
select,input[type=text],input[type=email],textarea{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:10px 12px;max-width:100%;font-weight:500;transition:border-color .12s}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:70px}
button{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:10px 20px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;transition:transform .08s,filter .12s}
button:hover{filter:brightness(.92)}
button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:5px 10px;font-size:11px}
button:disabled{opacity:.45;cursor:not-allowed}
.userbox{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-top:-28px;background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.userbox[hidden]{display:none}
.intro{background:var(--panel);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:24px 28px;margin-top:-28px;font-size:16px;line-height:1.65}
.intro b{color:var(--accent)}
.userbox .t{font-family:var(--display);text-transform:uppercase;font-size:22px;font-weight:700;letter-spacing:.02em}
.userbox .n{color:var(--muted);font-size:13px}
.userbox .r{margin-left:auto}
.band{height:0;margin-top:28px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:24px 48px}
.pager .right{display:flex;gap:10px;margin-left:auto}
.panel{background:var(--panel);border:0;border-top:4px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 28px 22px;margin-block:0 8px}
.panel>h2{padding:12px 0 8px;font-size:24px}
:root[data-brand="AR"] .panel{border-top-color:var(--gold)}
.panel>.body{padding:0}
.row{padding:16px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px}
.row .help{color:var(--muted);font-size:13px;margin-top:6px}
.row .ctl{margin-top:8px}
.sw{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#b8bcc0;border-radius:20px;transition:background .15s}
.sw i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:before{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled+i{opacity:.4}
@media (prefers-reduced-motion:reduce){.sw i,.sw i:before{transition:none}}
.roltab{width:100%;max-width:520px;border-collapse:collapse;margin-top:6px}
.roltab th{font-size:12px;padding:6px 8px}
.roltab td{padding:9px 8px;border-bottom:1px solid var(--border)}
.roltab td:first-child{font-weight:600}
.roltab td.c{text-align:center;width:120px}
.roltab.nieuw .vervuld{display:none}
.note{background:var(--panel2);border-left:4px solid var(--accent);border-radius:3px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:3px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-block:12px}
.stat{background:var(--panel2);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.name{font-weight:600;white-space:nowrap}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;font-size:12px;border:1px solid transparent;white-space:nowrap}
.chip.voorgesteld{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.goedgekeurd{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.afgewezen{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.over{color:var(--warn);font-weight:700}
.overnote{background:var(--warn-soft);border-left:4px solid var(--warn);padding:6px 10px;font-size:12px;margin-top:4px}
.chip.potentieel{background:var(--pot-soft);color:var(--pot);border-color:var(--pot);border-style:dashed}
.chip.stil{opacity:.7}
.bar{display:inline-block;width:90px;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%}
.chip small{font-size:10px;opacity:.8}
.chip .act{display:inline-flex;gap:2px}
.chip .act button{padding:0 5px;font-size:12px;line-height:18px;border-radius:0;background:transparent;border-color:currentColor;color:inherit;text-transform:none;letter-spacing:0}
.tag{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--panel2);color:var(--muted)}
.tag.lbl{background:var(--accent-soft);color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wkc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.wkc input{margin-top:4px}
.wkc .d{font-size:12px;color:var(--muted)}
.slotrow{display:grid;grid-template-columns:120px 70px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--panel2)}
.slotrow .r{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:15px;padding-top:8px}
.slotrow .cnt select{width:70px}
.slotrow .picks{display:flex;flex-wrap:wrap;gap:8px}
.slotrow .pick{flex:1 1 220px;min-width:200px}
.slotrow .pick select{width:100%}
.slotrow .pick select.over{color:var(--warn);font-weight:700}
@media (max-width:700px){.slotrow{grid-template-columns:1fr}}
.slot{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .r{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.slot select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.slot{grid-template-columns:1fr}}
.sheet{font-size:12px;border:1px solid var(--line)}
.sheet th{background:var(--panel2);color:var(--ink)}
.sheet .grp{background:var(--accent-soft);color:var(--accent);text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em}
.sheet td.empty{color:var(--off);font-style:italic}

.intake .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;font-size:13px}
.rolgrid label{display:flex;gap:6px;align-items:center;cursor:pointer}
.field{margin-block:8px;display:block}
.field[hidden]{display:none}
.field input,.field select{width:100%}
.wkform .tools{align-items:flex-end}
.field>span{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);margin-bottom:3px}
.model dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.model dt{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.model dd{margin:0;color:var(--muted)}
@media (max-width:600px){.model dl{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.right{text-align:right}
.login{max-width:560px}
.login input{width:100%}
.login .row{border-bottom:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.errbox{display:none;margin:14px 0 0;padding:12px 16px;border-left:4px solid #c0392b;background:#fdf1ef;color:#7a1f14;font-size:14px;line-height:1.45;border-radius:3px;box-shadow:var(--shadow)}
.errbox.show{display:block}
.errbox b{display:block;margin-bottom:2px}
.errbox ul{margin:4px 0 0 18px;padding:0}
.invalid{outline:2px solid #c0392b !important;outline-offset:1px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

let toastT;function toast(m,ms=2000){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
/* Foutmelding die blijft staan tot de volgende actie. items = lijst van redenen. */
function showErr(titel,items){const b=document.getElementById('err');if(!b)return;const list=(items||[]).filter(Boolean);
  b.innerHTML=`<b>${esc(titel)}</b>${list.length?`<ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`;b.classList.add('show');b.scrollIntoView({block:'nearest',behavior:'smooth'});}
function clearErr(){const b=document.getElementById('err');if(b){b.classList.remove('show');b.innerHTML='';}document.querySelectorAll('.invalid').forEach(x=>x.classList.remove('invalid'));}
function mark(el){if(el)el.classList.add('invalid');}
/* Vertaalt database- en netwerkfouten naar iets wat de gebruiker kan gebruiken. */
function uitlegFout(e){const m=(e&&(e.message||e.msg||String(e)))||'Onbekende fout';
  if(/row-level security/i.test(m))return 'Je account heeft geen rechten om dit op te slaan. Meestal betekent dit dat je profiel niet als crew staat ingesteld; vraag kantoor om je rollen te controleren.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Geen verbinding met de server. Controleer je internet en probeer opnieuw.';
  if(/function .* does not exist/i.test(m))return 'De database mist nog een onderdeel ('+m.replace(/^.*function\s+/i,'').replace(/\s+does not exist.*$/i,'')+'). Kantoor moet het SQL-script nog draaien.';
  if(/column .* does not exist/i.test(m))return 'De database loopt achter op de app ('+m+'). Kantoor moet het SQL-script nog draaien.';
  if(/JWT|not authenticated|session/i.test(m))return 'Je bent niet (meer) ingelogd. Vraag een nieuwe inloglink aan.';
  if(/duplicate key/i.test(m))return 'Dit staat er al in.';
  return m;}

function LocalStore(){
  const KEY='crewpoort-app-v4';
  let S;
  const seed=()=>{
    const goedkeuringen=[];
    DEMO.intake.filter(i=>!DEMO.labels.find(l=>l.id===i.label)?.zonder_rollen).forEach(i=>{
      i.vervuld.forEach(r=>goedkeuringen.push({crew:i.crew,label:i.label,rol:r,status:'goedgekeurd',bron:'vervuld',door:null,datum:'2026-09-21',notitie:''}));
      i.voorkeur.filter(r=>!i.vervuld.includes(r)).forEach(r=>goedkeuringen.push({crew:i.crew,label:i.label,rol:r,status:'voorgesteld',bron:'voorkeur',door:'crewlid',datum:'2026-09-21',notitie:''}));
    });
    const set=(c,l,r,st,door,n='')=>{const g=goedkeuringen.find(x=>x.crew===c&&x.label===l&&x.rol===r);if(g){g.status=st;g.door=door;g.notitie=n;g.datum='2026-09-28';}};
    set('c5','4M','PL','goedgekeurd','u_wouter');set('c5','4M','Spreker','goedgekeurd','u_wouter');
    set('c1','4M','Route','goedgekeurd','u_wouter');set('c1','4M','Routeleider','goedgekeurd','u_wouter');
    set('c1','4F','Facilitair','afgewezen','u_wouter','Eerst een Family-weekend als deelnemer meemaken');
    set('c4','AR','PL','goedgekeurd','u_nadine');set('c4','AR','GL','goedgekeurd','u_nadine');
    set('c9','LI','PL','goedgekeurd','u_auke');set('c7','4M','EHBO','goedgekeurd','u_wouter');
    const beschikbaar={c5:['w1','w2','w4','w6'],c1:['w1','w2','w5'],c4:['w9','w10'],c9:['w11','w12','w2'],c7:['w1','w2'],c13:['w1','w4'],c3:['w1','w2','w4'],c10:['w6','w8'],c6:['w9','w6']};
    return {intake:JSON.parse(JSON.stringify(DEMO.intake)),goedkeuringen,beschikbaar,indeling:{},weekends:JSON.parse(JSON.stringify(DEMO.weekends)),toewijzingen:JSON.parse(JSON.stringify(DEMO.toewijzingen)),medisch:JSON.parse(JSON.stringify(DEMO.medisch)),pending:[],twPending:[]};
  };
  try{S=JSON.parse(localStorage.getItem(KEY))||seed();}catch(e){S=seed();}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
  const uid=()=>Math.random().toString(36).slice(2,9);
  return {
    mode:'demo',
    async init(){return {labels:DEMO.labels,rollen:DEMO.rollen,users:DEMO.users};},
    async load(){return JSON.parse(JSON.stringify(S));},
    async saveIntake(i){const k=S.intake.findIndex(x=>x.crew===i.crew&&x.label===i.label);if(k>=0)S.intake[k]=i;else S.intake.push(i);
      if(!zonderRollen(i.label))[...i.vervuld.map(r=>[r,'vervuld']),...i.voorkeur.filter(r=>!i.vervuld.includes(r)).map(r=>[r,'voorkeur'])].forEach(([r,bron])=>{
        if(!S.goedkeuringen.some(g=>g.crew===i.crew&&g.label===i.label&&g.rol===r))S.goedkeuringen.push({crew:i.crew,label:i.label,rol:r,status:bron==='vervuld'?'goedgekeurd':'voorgesteld',bron,door:bron==='vervuld'?null:'crewlid',datum:today(),notitie:''});});
      save();},
    async deleteIntake(crew,label){S.intake=S.intake.filter(i=>!(i.crew===crew&&i.label===label));save();},
    async setStatus(g,status,door,notitie=''){const x=S.goedkeuringen.find(y=>y.crew===g.crew&&y.label===g.label&&y.rol===g.rol);x.status=status;x.door=door;x.datum=today();x.notitie=notitie;save();},
    async addVoorstel(g){if(S.goedkeuringen.some(y=>y.crew===g.crew&&y.label===g.label&&y.rol===g.rol))return false;S.goedkeuringen.push({...g,status:'voorgesteld',bron:'kantoor',datum:today(),notitie:''});save();return true;},
    async setAvail(crew,wid,on){S.beschikbaar[crew]=S.beschikbaar[crew]||[];const i=S.beschikbaar[crew].indexOf(wid);if(on&&i<0)S.beschikbaar[crew].push(wid);if(!on&&i>=0)S.beschikbaar[crew].splice(i,1);save();},
    async setSlot(wid,key,crew){S.indeling[wid]=S.indeling[wid]||{};S.indeling[wid][key]=crew;save();},
    async saveWeekend(w){const k=S.weekends.findIndex(x=>x.id===w.id);if(k>=0)S.weekends[k]=w;else S.weekends.push(w);save();},
    async setSlots(id,slots){const w=S.weekends.find(x=>x.id===id);if(w){w.slots=slots;save();}},
    async deleteWeekend(id){S.weekends=S.weekends.filter(w=>w.id!==id);delete S.indeling[id];Object.values(S.beschikbaar).forEach(a=>{const i=a.indexOf(id);if(i>=0)a.splice(i,1);});save();},
    async addToewijzing(t){S.toewijzingen.push({...t,id:uid()});save();},
    async updateProfile(id,p){const u=DEMO.users.find(x=>x.id===id);Object.assign(u,p);},
    async saveMedisch(m){const k=S.medisch.findIndex(x=>x.crew===m.crew);const row={...m,ingevuld:true};if(k>=0)S.medisch[k]=row;else S.medisch.push(row);save();},
    async addPending(p){S.pending.push(p);save();},
    async deletePending(email){S.pending=S.pending.filter(x=>x.email!==email);save();},
    async setRollen(id,rollen){const u=DEMO.users.find(x=>x.id===id);u.rollen=rollen;u.rol=rollen.includes('kantoor')?'kantoor':rollen.includes('leider')?'leider':'crew';},
    async setLeider(label,veld,userId){const l=DEMO.labels.find(x=>x.id===label);l[veld]=userId||null;},
    async deleteToewijzing(id){S.toewijzingen=S.toewijzingen.filter(t=>t.id!==id);save();},
    async addToewijzingPending(t){(S.twPending=S.twPending||[]).push(t);save();},
    async deleteToewijzingPending(t){S.twPending=(S.twPending||[]).filter(x=>JSON.stringify(x)!==JSON.stringify(t));save();},
    reset(){S=seed();save();},
  };
}

function SupabaseStore(client){
  // Verwacht schema uit supabase/schema.sql. Alle autorisatie zit in RLS; de frontend filtert alleen voor de weergave.
  const one=async q=>{const {data,error}=await q;if(error){showErr('Opslaan is niet gelukt',[uitlegFout(error)]);throw error;}return data;};
  return {
    mode:'live',
    async init(){
      const [labels,rollen,users]=await Promise.all([
        one(client.from('labels').select('id,naam,voor,gast,leider_m,leider_v,zonder_rollen')),
        one(client.from('rollen').select('id,volgorde').order('volgorde')),
        one(client.from('profiles').select('id,naam,rol,rollen,geslacht,email,telefoon')),
      ]);
      return {labels,rollen:rollen.map(r=>r.id),users};
    },
    async load(){
      const [intake,goedkeuringen,besch,ind,weekends,toewijzingen,medisch,pending,twPending]=await Promise.all([
        one(client.from('intake').select('crew,label,ervaring,vervuld,voorkeur,toelichting')),
        one(client.from('goedkeuringen').select('crew,label,rol,status,bron,door,datum,notitie')),
        one(client.from('beschikbaarheid').select('crew,weekend')),
        one(client.from('indeling').select('weekend,rol,plek,crew')),
        one(client.from('weekends').select('id,label,naam,datum,start_datum,slots,startdag,terugkomavond,crewmeeting,voor,opmerking,sheet_url').order('start_datum')),
        one(client.from('toewijzingen').select('id,user,functie,soort,weekend,label,rol')),
        one(client.from('medisch').select('crew,medisch,medisch_toelichting,allergie,allergie_toelichting,ice_naam,ice_telefoon,ice_relatie,ingevuld')),
        client.from('profiles_pending').select('email,naam,rol,rollen,geslacht').then(r=>r.data||[]),
        client.from('toewijzingen_pending').select('email,functie,soort,weekend,label,rol').then(r=>r.data||[]),
      ]);
      const beschikbaar={};besch.forEach(b=>(beschikbaar[b.crew]=beschikbaar[b.crew]||[]).push(b.weekend));
      const indeling={};ind.forEach(i=>(indeling[i.weekend]=indeling[i.weekend]||{})[`${i.rol}#${i.plek}`]=i.crew);
      let verdeling=null;try{const {data}=await client.rpc('verdeling_overzicht');if(Array.isArray(data))verdeling=data;}catch(e){}
      return {intake,goedkeuringen,beschikbaar,indeling,weekends,toewijzingen,medisch,pending,twPending,verdeling};
    },
    async loadUsers(){const {data}=await client.from('profiles').select('id,naam,rol,rollen,geslacht,email,telefoon');return data||null;},
    async saveIntake(i){await one(client.from('intake').upsert(i,{onConflict:'crew,label'}));await one(client.rpc('stel_voor_uit_intake',{p_crew:i.crew,p_label:i.label}));},
    async deleteIntake(crew,label){await one(client.from('intake').delete().match({crew,label}));},
    async setStatus(g,status,door,notitie=''){const rows=await one(client.from('goedkeuringen').update({status,door,notitie,datum:today()}).match({crew:g.crew,label:g.label,rol:g.rol}).select('crew'));
      if(!rows||!rows.length){showErr('Screening niet opgeslagen',['De database weigert de wijziging: je bent niet gekoppeld als bewegingsleider van dit label voor deze doelgroep (man/vrouw). Kantoor koppelt bewegingsleiders onder Crewbeheer.']);throw new Error('geen rechten');}},
    async setLeider(label,veld,userId){await one(client.from('labels').update({[veld]:userId||null}).eq('id',label));},
    async addVoorstel(g){const {error}=await client.from('goedkeuringen').insert({...g,status:'voorgesteld',bron:'kantoor',datum:today()});if(error){if(error.code==='23505')return false;toast('Fout: '+error.message);throw error;}return true;},
    async setAvail(crew,weekend,on){if(on)await one(client.from('beschikbaarheid').upsert({crew,weekend}));else await one(client.from('beschikbaarheid').delete().match({crew,weekend}));},
    async setSlot(weekend,key,crew){const [rol,plek]=key.split('#');if(crew)await one(client.from('indeling').upsert({weekend,rol,plek:+plek,crew},{onConflict:'weekend,rol,plek'}));else await one(client.from('indeling').delete().match({weekend,rol,plek:+plek}));},
    async saveWeekend(w){await one(client.from('weekends').upsert(w));},
    async setSlots(id,slots){await one(client.rpc('zet_slots',{p_weekend:id,p_slots:slots}));},
    async deleteWeekend(id){await one(client.from('weekends').delete().eq('id',id));},
    async addToewijzing(t){await one(client.from('toewijzingen').insert(t));},
    async updateProfile(id,p){await one(client.from('profiles').update(p).eq('id',id));},
    async saveMedisch(m){await one(client.from('medisch').upsert({...m,ingevuld:true,bijgewerkt:new Date().toISOString()},{onConflict:'crew'}));},
    async addPending(p){await one(client.from('profiles_pending').upsert({email:p.email.toLowerCase(),naam:p.naam,rol:p.rol,rollen:p.rollen,geslacht:p.geslacht},{onConflict:'email'}));},
    async deletePending(email){await one(client.from('profiles_pending').delete().eq('email',email));},
    async setRollen(id,rollen){await one(client.rpc('zet_rollen',{p_user:id,p_rollen:rollen}));},
    async deleteToewijzing(id){await one(client.from('toewijzingen').delete().eq('id',id));},
    async addToewijzingPending(t){await one(client.from('toewijzingen_pending').insert({...t,email:t.email.toLowerCase()}));},
    async deleteToewijzingPending(t){let q=client.from('toewijzingen_pending').delete().match({email:t.email,functie:t.functie,soort:t.soort});for(const k of ['weekend','label','rol'])q=t[k]?q.eq(k,t[k]):q.is(k,null);await one(q);},
    reset(){},
  };
}

let db, M /* stamdata */, D /* data */, me /* huidige gebruiker */, UI={step:null,crewView:null,weekendView:null};
const rollenVan=u=>u.rollen&&u.rollen.length?u.rollen:[u.rol];
const heeft=r=>rollenVan(me).includes(r);
const isKantoor=()=>heeft('kantoor'), isLeider=()=>heeft('leider'), isCrew=()=>heeft('crew');
const lbl=id=>M.labels.find(l=>l.id===id);
const user=id=>M.users.find(u=>u.id===id);
const wk=id=>D.weekends.find(w=>w.id===id);
const crewUsers=()=>M.users.filter(u=>rollenVan(u).includes('crew'));
const labelsVoor=u=>M.labels.filter(l=>!l.voor||!u.geslacht||l.voor.includes(u.geslacht)||isGast(l,u));
/* Gastlabel: label voor een andere doelgroep waar je toch mee kunt (bijv. mannen bij Arise). */
/* Label zonder rollen (Promo): geen screening, geen indeling per rol; alleen één lijst met beschikbare crew. */
const zonderRollen=l=>!!(typeof l==='string'?lbl(l):l)?.zonder_rollen;
const isGast=(l,u)=>!!(l&&l.gast&&u&&u.geslacht&&!(l.voor||[]).includes(u.geslacht)&&l.gast.includes(u.geslacht));
const gastLabelsVoor=u=>M.labels.filter(l=>isGast(l,u));
/* Gast ziet de weekenden pas als hij eerder mee was, of na validatie door de bewegingsleider. */
const gastToegang=(c,l)=>{const i=intakeOf(c,l);return !!i&&(i.ervaring!=='nieuw'||gescreend(c,l).length>0);};
// bewegingsleider voor (label, geslacht)
const leiderVoor=(l,geslacht)=>{const L=lbl(l);if(!L)return null;return geslacht==='V'?L.leider_v:geslacht==='M'?L.leider_m:(L.leider_m||L.leider_v);};
const screenDoorMij=(cid,l)=>isKantoor()||leiderVoor(l,user(cid)?.geslacht)===me.id;
const myLabels=()=>isKantoor()?M.labels.map(l=>l.id):isLeider()?M.labels.filter(l=>l.leider_m===me.id||l.leider_v===me.id).map(l=>l.id):[];
const screenLabels=()=>myLabels().filter(l=>!zonderRollen(l));
const medischVan=c=>(D.medisch||[]).find(m=>m.crew===c);
/* Bekend = ingevuld én er is een ICE-telefoonnummer; anders krijgt het crewlid stap 2 alsnog, voorgevuld met wat we al hebben. */
const medischBekend=c=>{const m=medischVan(c);return !!m&&!!m.ingevuld&&!!(m.ice_telefoon||'').trim();};
const intakeOf=(c,l)=>D.intake.find(i=>i.crew===c&&i.label===l);
const G=(c,l)=>D.goedkeuringen.filter(g=>g.crew===c&&(!l||g.label===l));
/* Gescreend (goedgekeurd) ongeacht wens. Vervulde functies worden automatisch goedgekeurd; de leider kan alleen afkeuren. */
const gescreend=(c,l)=>G(c,l).filter(g=>g.status==='goedgekeurd').map(g=>g.rol);
/* Kiesbaar voor de PL = goedgekeurd EN door het crewlid gewenst voor 2027. Wat iemand ooit deed telt alleen voor de screening. */
const wil=(c,l)=>intakeOf(c,l)?.voorkeur||[];
const isApproved=(c,l,r)=>wil(c,l).includes(r)&&D.goedkeuringen.some(g=>g.crew===c&&g.label===l&&g.rol===r&&g.status==='goedgekeurd');
const approvedRoles=(c,l)=>gescreend(c,l).filter(r=>wil(c,l).includes(r));
const isAvail=(c,w)=>(D.beschikbaar[c]||[]).includes(w);
const timesChosen=c=>Object.values(D.indeling).reduce((n,s)=>n+Object.values(s).filter(v=>v===c).length,0);
const isPotential=g=>g.bron==='voorkeur'&&g.status!=='afgewezen';
const chosenDetail=c=>Object.entries(D.indeling).flatMap(([wid,slots])=>Object.entries(slots).filter(([k,v])=>v===c).map(([k])=>{const w=wk(wid);return w?`${w.naam} (${fmtRol(k.split('#')[0])})`:null;})).filter(Boolean);
const overTxt=c=>{const n=timesChosen(c);return n>MAX_OK?`Al ${n}x gekozen: ${chosenDetail(c).join(', ')}`:'';};
// toewijzingen: welke weekenden/rollen mag deze gebruiker zien
const myToew=()=>D.toewijzingen.filter(t=>t.user===me.id);
function scopeWeekends(){ // [{weekend, rol|null, functie}]
  const out=[];
  myToew().forEach(t=>{
    if(t.soort==='weekend'){const w=wk(t.weekend);if(w)out.push({w,rol:null,functie:t.functie});}
    if(t.soort==='label')D.weekends.filter(w=>w.label===t.label).forEach(w=>out.push({w,rol:null,functie:t.functie}));
    if(t.soort==='rol')D.weekends.filter(w=>!t.label||w.label===t.label).forEach(w=>out.push({w,rol:t.rol,functie:t.functie}));
  });
  return out;
}
/* Wie mag welke plek indelen: kantoor en bewegingsleider alles; PL alles behalve EHBO en Foto/video;
   GL alleen Spreker; FL alleen Facilitair; coördinator van een rol alleen die rol binnen zijn label(s). */
const PL_NIET=['EHBO','Foto/video'];
function magIndelen(w,rol){
  if(isKantoor())return true;
  if(isLeider()&&myLabels().includes(w.label))return true;
  return myToew().some(t=>(t.soort==='weekend'&&t.weekend===w.id&&((t.functie==='PL'&&!PL_NIET.includes(rol))||(t.functie==='GL'&&rol==='Spreker')||(t.functie==='FL'&&rol==='Facilitair')))
    ||(t.soort==='rol'&&t.rol===rol&&(!t.label||t.label===w.label)));
}
const magSlots=w=>isKantoor()||myToew().some(t=>t.soort==='weekend'&&t.weekend===w.id&&t.functie==='PL');
const bijeenkomsten=w=>[w.startdag,w.crewmeeting,w.terugkomavond].filter(Boolean);
/* Doelgroep van een weekend: eigen instelling (voor) of anders die van het label. */
const wkVoor=w=>(w.voor&&w.voor.length?w.voor:(lbl(w.label)?.voor||['M','V']));
const wkPastBij=(w,u)=>!u||!u.geslacht||wkVoor(w).includes(u.geslacht)||(isGast(lbl(w.label),u)&&!(w.voor&&w.voor.length&&!w.voor.includes(u.geslacht))&&gastToegang(u.id,w.label));
/* Tekst onder een weekend voor de vrijwilliger: LET OP + opmerking + bijbehorende dagen. */
const letOp=w=>{const extra=bijeenkomsten(w);const op=(w.opmerking||'').trim();if(!extra.length&&!op)return '';return `<b>LET OP:</b> ${op?esc(op.replace(/[.\s]+$/,''))+'. ':''}${extra.length?esc(extra.join(', '))+'. Beschikbaar voor dit weekend = ook beschikbaar voor deze dagen/avonden. ':''}`;};
const fmtVoor=w=>{const v=wkVoor(w);return v.length===2?'mannen en vrouwen':v[0]==='M'?'alleen mannen':'alleen vrouwen';};

/* ---------- Views ---------- */
function stepsFor(){
  const s=[];
  if(isCrew()){s.push(['account','1 · Gegevens'],['medisch','2 · Medisch'],['profiel','3 · Inzet'],['uitvraag','4 · Beschikbaarheid']);if(myToew().length)s.push(['aanmeldingen','Aanmeldingen']);}
  if(isKantoor()||isLeider())s.push(['voortgang','Voortgang'],['goedkeuring','Screening'],['potentieel','Potentieel'],['indeling','Indeling'],['export','Exportsheet']);
  if(isKantoor()||isLeider()||myToew().some(t=>t.functie==='PL'))s.push(['verdeling','Verdeling']);
  if(isKantoor())s.push(['weekenden','Weekenden'],['toewijzingen','Toewijzingen'],['crewbeheer','Crew'],['model','Model']);
  return s;
}
function renderSteps(){
  const st=stepsFor();if(!st.some(([k])=>k===UI.step)||locked(UI.step)){const f=fase();UI.step=isCrew()?Object.keys(FASE_STEP).find(k=>FASE_STEP[k]===f):st[0][0];}
  document.getElementById('steps').innerHTML=st.map(([k,t])=>`<button class="${UI.step===k?'on':''}" data-step="${k}" ${locked(k)?'disabled title="Eerst de vorige stap afronden"':''}>${locked(k)?'🔒 ':''}${t}</button>`).join('');
}
function renderWho(){
  const box=document.getElementById('whoBox');
  if(db.mode==='demo'){
    const sub=u=>' · '+[...rollenVan(u),...new Set(D.toewijzingen.filter(t=>t.user===u.id).map(t=>t.functie))].join('/');
    box.innerHTML=`<label for="who">Demo</label><select id="who">${M.users.map(u=>`<option value="${u.id}" ${me.id===u.id?'selected':''}>${esc(u.naam)}${sub(u)}</option>`).join('')}</select><button id="reset" class="small">Reset</button>`;
  } else box.innerHTML='';
}

function chip(g,canJudge){
  const acts=canJudge?`<span class="act">${g.status!=='goedgekeurd'?`<button data-ok="${g.crew}|${g.label}|${g.rol}" title="Goedkeuren">✓</button>`:''}${g.status!=='afgewezen'?`<button data-no="${g.crew}|${g.label}|${g.rol}" title="Afwijzen">✕</button>`:''}</span>`:'';
  const cls=g.status==='voorgesteld'&&isPotential(g)?'potentieel':g.status;
  const t=g.status==='voorgesteld'?(isPotential(g)?'voorkeur van het crewlid, nog niet vervuld':'voorgesteld op basis van vervulde functie'):g.status==='goedgekeurd'&&!g.door?'eerder vervuld, automatisch goedgekeurd (alleen afkeuren mogelijk)':`${g.status} door ${user(g.door)?.naam||g.door} op ${g.datum}${g.notitie?': '+g.notitie:''}`;
  const nietGewenst=g.status==='goedgekeurd'&&!wil(g.crew,g.label).includes(g.rol);
  return `<span class="chip ${cls}${nietGewenst?' stil':''}" title="${esc(t)}${nietGewenst?' · niet gewenst voor 2027, telt alleen als ervaring':''}">${esc(fmtRol(g.rol))}${nietGewenst?' <small>(ervaring)</small>':''}${acts}</span>`;
}

function viewGoedkeuring(){
  const labels=screenLabels();
  const mine=D.goedkeuringen.filter(g=>labels.includes(g.label)&&screenDoorMij(g.crew,g.label));
  const cnt=st=>mine.filter(g=>g.status===st).length;
  const rows=crewUsers().filter(c=>mine.some(g=>g.crew===c.id)||D.intake.some(i=>i.crew===c.id&&labels.includes(i.label)&&screenDoorMij(c.id,i.label))).map(c=>{
    const per=labels.filter(l=>screenDoorMij(c.id,l)&&(mine.some(g=>g.crew===c.id&&g.label===l)||intakeOf(c.id,l))).map(l=>{
      const i=intakeOf(c.id,l);
      const chips=mine.filter(g=>g.crew===c.id&&g.label===l).map(g=>chip(g,isLeider())).join('');
      return `<div style="margin-bottom:8px"><span class="tag lbl">${esc(lbl(l).naam)}</span> <span class="muted" style="font-size:12px">${i?esc(fmtErv(i.ervaring)):'geen intake'}</span> <span class="chips">${chips}</span></div>`;
    }).join('');
    const opm=D.intake.find(i=>i.crew===c.id&&i.toelichting)?.toelichting;
    const nAv=D.weekends.filter(w=>labels.includes(w.label)&&isAvail(c.id,w.id)).length;
    return `<tr><td class="name">${esc(c.naam)}<div class="muted" style="font-weight:400;font-size:12px">${c.geslacht||''} · ${nAv?nAv+'× beschikbaar':'nog geen beschikbaarheid'}</div></td><td>${per}${opm?`<div class="muted" style="font-size:12px">„${esc(opm)}”</div>`:''}</td></tr>`;
  }).join('');
  const add=isKantoor()?`<div class="tools"><span class="muted">Nieuw voorstel:</span><select id="nvCrew">${crewUsers().map(c=>`<option value="${c.id}">${esc(c.naam)}</option>`).join('')}</select><select id="nvLabel">${labels.map(l=>`<option value="${l}">${esc(lbl(l).naam)}</option>`).join('')}</select><select id="nvRol">${M.rollen.map(r=>`<option value="${r}">${fmtRol(r)}</option>`).join('')}</select><button id="nvAdd" class="small">Voorstellen</button></div>`:'';
  const scope=isLeider()?M.labels.flatMap(l=>[l.leider_m===me.id?l.naam+' (mannen)':null,l.leider_v===me.id?l.naam+' (vrouwen)':null]).filter(Boolean).join(', '):'';
  return `<div class="band"></div><section class="panel">
    <h2>Screening per label × rol</h2><div class="body">
    <p class="muted" style="margin:4px 0 10px">${!isLeider()?'Kantoor stelt voor, alleen de bewegingsleider screent.':`Je screent: ${esc(scope)}. Vervulde functies zijn automatisch goedgekeurd (groen); daar hoef je alleen in te grijpen als iemand niet meer in die rol past (kruisje). Gestippeld = gewenste rol die iemand nog niet vervuld heeft: die beoordeel jij. Kiesbaar voor de projectleider wordt alleen wat goedgekeurd én dit jaar gewenst is.`}</p>
    <div class="banner"><b>Deadline ${DEADLINE}.</b> Daarna begint het indelen. Wie dan nog niet gescreend is, staat wel als beschikbaar in het systeem maar niet in de keuzelijst van de projectleider.</div>
    <div class="stats">
      <div class="stat"><div class="v">${cnt('voorgesteld')}</div><div class="l">te beoordelen</div></div>
      <div class="stat"><div class="v">${mine.filter(g=>g.status==='voorgesteld'&&isPotential(g)).length}</div><div class="l">waarvan potentieel</div></div>
      <div class="stat"><div class="v">${mine.filter(g=>g.status==='goedgekeurd'&&!g.door).length}</div><div class="l">ervaren, automatisch</div></div>
      <div class="stat"><div class="v">${mine.filter(g=>g.status==='goedgekeurd'&&g.door).length}</div><div class="l">goedgekeurd door jou</div></div>
      <div class="stat"><div class="v">${crewUsers().filter(c=>D.weekends.some(w=>labels.includes(w.label)&&isAvail(c.id,w.id))&&!labels.some(l=>approvedRoles(c.id,l).length)).length}</div><div class="l">beschikbaar, nog niet kiesbaar</div></div>
    </div>
    ${isLeider()?'':add}
    <div class="tw"><table><thead><tr><th>Crewlid</th><th>Intake en beslissingen</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="muted">Nog geen intake of voorstellen.</td></tr>'}</tbody></table></div>
    <p class="note" style="margin-top:12px">Niet zichtbaar hier: mail, telefoon. Afwijs-notities gaan nooit mee naar de exportsheet.</p></div></section>
    ${ervarenPerFunctie(mine)}${afgewezenOverzicht(mine)}`;
}
/* Overzicht van afgewezen screenings met notitie; terugdraaien zet de rol terug op 'voorgesteld'. */
function afgewezenOverzicht(mine){
  const af=mine.filter(g=>g.status==='afgewezen').sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')||user(a.crew).naam.localeCompare(user(b.crew).naam));
  const rows=af.map(g=>`<tr><td class="name">${esc(user(g.crew)?.naam||g.crew)}</td><td><span class="tag lbl">${esc(lbl(g.label).naam)}</span></td><td>${esc(fmtRol(g.rol))}</td><td>${esc(g.notitie||'')||'<span class="muted">geen notitie</span>'}</td><td class="muted" style="white-space:nowrap">${esc(user(g.door)?.naam||'')}<br>${esc(g.datum||'')}</td><td>${isLeider()||isKantoor()?`<button class="small" data-heropen="${g.crew}|${g.label}|${g.rol}">Terugdraaien</button>`:''}</td></tr>`).join('');
  return `<div class="band"></div><section class="panel"><h2>Afgewezen</h2><div class="body">
    <p class="muted">Alle afgewezen rollen binnen jouw labels, met de interne notitie. Alleen zichtbaar voor bewegingsleiders en kantoor; gaat nooit mee in een export. Terugdraaien zet de rol terug op "te beoordelen".</p>
    <div class="tw"><table><thead><tr><th>Crewlid</th><th>Label</th><th>Rol</th><th>Notitie</th><th>Door / datum</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Nog niets afgewezen.</td></tr>'}</tbody></table></div></div></section>`;
}
/* Informatieve lijst per functie: wie heeft die functie eerder vervuld (automatisch goedgekeurd). Alleen afkeuren mogelijk. */
function ervarenPerFunctie(mine){
  const erv=mine.filter(g=>g.bron==='vervuld'&&g.status!=='afgewezen');
  const byRol={};erv.forEach(g=>(byRol[g.rol]=byRol[g.rol]||[]).push(g));
  const rows=M.rollen.filter(r=>byRol[r]).map(r=>`<tr><td class="name">${esc(fmtRol(r))}<div class="muted" style="font-weight:400;font-size:12px">${byRol[r].length} ervaren</div></td><td>${byRol[r].sort((a,b)=>user(a.crew).naam.localeCompare(user(b.crew).naam)).map(g=>{const i=intakeOf(g.crew,g.label);const w=wil(g.crew,g.label).includes(r);
    return `<div style="margin-bottom:4px">${esc(user(g.crew).naam)} <span class="tag lbl">${esc(lbl(g.label).naam)}</span> <span class="muted" style="font-size:12px">${esc(fmtErv(i?.ervaring))}${w?'':' · wil dit in 2027 niet'}</span> ${chip(g,isLeider()||isKantoor())}</div>`;}).join('')}</td></tr>`).join('');
  return `<div class="band"></div><section class="panel"><h2>Ervaren crew per functie</h2><div class="body">
    <p class="muted">Wie deze functie eerder vervulde, is automatisch goedgekeurd en hoeft niet opnieuw gescreend te worden. Past iemand er niet meer in? Klik op het kruisje. "Wil dit in 2027 niet" betekent: wel ervaring, maar niet kiesbaar voor de projectleider in deze rol.</p>
    <div class="tw"><table><thead><tr><th>Functie</th><th>Ervaren crew</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="muted">Nog niemand met vervulde functies.</td></tr>'}</tbody></table></div></div></section>`;
}

function viewPotentieel(){
  const labels=screenLabels();
  const pot=D.goedkeuringen.filter(g=>labels.includes(g.label)&&isPotential(g)&&screenDoorMij(g.crew,g.label));
  const byRol={};pot.forEach(g=>(byRol[g.rol]=byRol[g.rol]||[]).push(g));
  const rows=M.rollen.filter(r=>byRol[r]).map(r=>`<tr><td class="name">${esc(fmtRol(r))}</td><td>${byRol[r].map(g=>{const i=intakeOf(g.crew,g.label);return `<div style="margin-bottom:4px">${esc(user(g.crew).naam)} <span class="tag lbl">${esc(lbl(g.label).naam)}</span> <span class="muted" style="font-size:12px">${esc(fmtErv(i?.ervaring))}, nu: ${esc(fmtRollen(i?.vervuld)||'geen rol')}</span> ${chip(g,isLeider())}</div>`;}).join('')}</td></tr>`).join('');
  return `<div class="band"></div><section class="panel"><h2>Potentieel scannen</h2><div class="body">
    <p class="muted">Crewleden die een rol willen die ze nog niet vervuld hebben. Dit is de enige screening die handwerk is: goedkeuren zet ze in de keuzelijst voor die rol, afwijzen laat ze in hun huidige rol(len).</p>
    <div class="tw"><table><thead><tr><th>Gewenste rol</th><th>Wie</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="muted">Geen open voorkeuren.</td></tr>'}</tbody></table></div></div></section>`;
}

    <form id="welkomForm" novalidate>
      <div class="row"><label class="lab" for="wNaam">Voor- en achternaam</label><div class="ctl"><input type="text" id="wNaam" name="naam" required value="${esc(me.naam||'')}" style="min-width:280px"></div></div>
      <div class="row"><label class="lab" for="wTel">Telefoonnummer</label><div class="help">Voor de appgroep en bij last-minute vragen.</div><div class="ctl"><input type="text" id="wTel" name="telefoon" required value="${esc(demoTel(me)||'')}" style="min-width:200px"></div></div>
      <div class="row"><div class="lab">Ik ben</div><div class="help">Bepaalt welke bewegingen je ziet: 4M is er voor mannen, Arise voor vrouwen.</div><div class="ctl" style="display:flex;gap:18px"><label><input type="radio" name="geslacht" value="M" ${me.geslacht==='M'?'checked':''} required> Man</label><label><input type="radio" name="geslacht" value="V" ${me.geslacht==='V'?'checked':''}> Vrouw</label></div></div>
      <div class="tools"><button class="primary" type="submit">Opslaan en verder</button></div>

}
const demoTel=u=>u.telefoon||(db.mode==='demo'&&u.id!=='c10'?'06-00000000':'');
const fase=()=>{if(!isCrew())return 4;if(!me.naam||!me.geslacht||!demoTel(me))return 1;if(!medischBekend(me.id))return 2;if(!D.intake.some(i=>i.crew===me.id))return 3;return 4;};
const FASE_STEP={account:1,medisch:2,profiel:3,uitvraag:4};
const ingeleverd=()=>{try{return !!localStorage.getItem('crewpoort-ingeleverd-'+me.id);}catch(e){return false;}};
const zetIngeleverd=()=>{try{localStorage.setItem('crewpoort-ingeleverd-'+me.id,today());}catch(e){}};
const locked=k=>isCrew()&&FASE_STEP[k]!==undefined&&FASE_STEP[k]>fase();

    </div>
    <div class="tools"><button class="primary" type="submit">Opslaan</button></div>

    ${self&&ingeleverd()?`<div class="band"></div><section class="panel"><h2>Bedankt, je opgave is binnen</h2><div class="body">${(()=>{const av=D.weekends.filter(w=>isAvail(c,w.id)&&wkPastBij(w,cu)).sort((a,b)=>(a.start_datum||'').localeCompare(b.start_datum||''));return `<p>Je staat beschikbaar voor <b>${av.length}</b> weekend(en) bij ${esc(labels.map(l=>l.naam).join(', ')||'nog geen label')}:</p>${av.length?`<ul style="margin:6px 0 14px 18px;padding:0">${av.map(w=>`<li><b>${esc(w.naam)}</b> <span class="muted">${esc(w.datum)} · ${esc(lbl(w.label).naam)}</span></li>`).join('')}</ul>`:''}<p>De bewegingsleider screent je rollen; daarna kan de projectleider je indelen. Je hoort van ons.</p>`;})()}<p class="muted">Verandert er iets? Pas het hieronder aan en klik opnieuw op inleveren.</p></div></section>`:''}<p class="note" style="margin-top:24px"><b>Stap 4: beschikbaarheid.</b> Zet aan waar je kunt en klik onderaan op <b>Opslaan en inleveren</b>, uiterlijk <b>${DEADLINE}</b>. Zodra je een weekend aanzet, zie je de bijbehorende dagen en bijzonderheden.</p>${blocks||'<div class="band"></div><section class="panel"><h2>Nog geen labels gekozen</h2><div class="body"><p class="muted">Kies eerst onder Mijn gegevens voor welke labels je je wilt inzetten.</p></div></section>'}`;

/* Knop: indeling naar het tabblad CREW + ICE van de productiesheet (Edge Function export-sheet). */
function exportKnop(w){
  if(zonderRollen(w.label))return '';

  return `<div class="tools" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)"><button class="primary small" data-exportsheet="${w.id}" ${n?'':'disabled title="Nog niemand ingedeeld"'}>Exporteer naar productiesheet</button><span class="muted" style="font-size:13px">${w.sheet_url?`Schrijft de ${n} ingedeelde crewleden (naam, telefoon, ICE) naar tabblad CREW + ICE; bestaande inhoud vanaf rij 3 wordt overschreven.`:'Nog geen productiesheet gekoppeld; kantoor vult de link in onder Weekenden.'}</span></div>`;

/* Lijst met beschikbare crew voor een weekend zonder rollen (Promo). */
function beschikbaarLijst(w){
  const av=crewUsers().filter(c=>wkPastBij(w,c)&&isAvail(c.id,w.id)).sort((a,b)=>a.naam.localeCompare(b.naam));
  const rows=av.map(c=>{const i=intakeOf(c.id,w.label);const andere=M.labels.filter(l=>l.id!==w.label&&intakeOf(c.id,l.id)).map(l=>l.naam);
    return `<tr><td class="name">${esc(c.naam)}</td><td>${c.geslacht||''}</td><td>${esc(fmtErv(i?.ervaring))}</td><td>${esc(andere.join(', '))}</td><td>${esc(i?.toelichting||'')}</td></tr>`;}).join('');
  return `<p class="muted">${esc(lbl(w.label).naam)} werkt zonder rollen: dit is de volledige lijst van wie beschikbaar is (${av.length}).</p>
    <div class="tw"><table><thead><tr><th>Naam</th><th>M/V</th><th>Ervaring</th><th>Ook crew bij</th><th>Opmerkingen</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">Nog niemand beschikbaar.</td></tr>'}</tbody></table></div>`;
}
// indelingsblok voor één weekend: per rol links de rol, dan het aantal (uitklapvak), dan evenveel keuzevakjes met beschikbare crew
function slotsHtml(w,editable,onlyRol,canEditSlots){
  const ind=D.indeling[w.id]||{};const mag=r=>editable&&magIndelen(w,r);
  const used=new Set(Object.values(ind).filter(Boolean));
  const rollen=M.rollen.filter(r=>!onlyRol||r===onlyRol).filter(r=>canEditSlots||(w.slots[r]||0)>0);
  return rollen.map(rol=>{const n=w.slots[rol]||0;
    const sel=(i)=>{const key=`${rol}#${i}`;const cur=ind[key]||'';
      const opts=crewUsers().filter(c=>wkPastBij(w,c)||ind[`${rol}#${i}`]===c.id).map(c=>{const ok=isApproved(c.id,w.label,rol),av=isAvail(c.id,w.id),busy=used.has(c.id)&&cur!==c.id;
        if(ok&&av&&!busy)return `<option value="${c.id}" ${cur===c.id?'selected':''}>${timesChosen(c.id)>MAX_OK?'⚠ ':''}${esc(c.naam)} · ${timesChosen(c.id)}x gekozen</option>`;
        if(cur===c.id)return `<option value="${c.id}" selected>${esc(c.naam)}</option>`;return null;}).filter(Boolean).join('');
      return mag(rol)?`<span class="pick"><select data-slot="${key}" data-wk="${w.id}" class="${cur&&timesChosen(cur)>MAX_OK?'over':''}"><option value="">niet ingedeeld</option>${opts}</select>${cur&&overTxt(cur)?`<div class="overnote">${esc(overTxt(cur))}</div>`:''}</span>`
        :`<span class="pick"><b class="${cur&&timesChosen(cur)>MAX_OK?'over':''}">${cur?esc(user(cur).naam):'nog open'}</b></span>`;};
    const blocked=n?crewUsers().filter(c=>wkPastBij(w,c)&&isAvail(c.id,w.id)&&!isApproved(c.id,w.label,rol)&&wil(c.id,w.label).includes(rol)).map(c=>c.naam):[];
    const cnt=canEditSlots?`<select data-slotcount="${rol}" data-wk="${w.id}" title="Aantal nodig">${Array.from({length:11},(_,k)=>`<option value="${k}" ${k===n?'selected':''}>${k}</option>`).join('')}</select>`:`<span class="muted">${n}</span>`;
    const wie=editable&&!mag(rol)?`<div class="muted" style="font-size:11px">${PL_NIET.includes(rol)?'via coördinator '+esc(fmtRol(rol)):'via PL'}</div>`:'';
    return `<div class="slotrow"><div class="r">${esc(fmtRol(rol))}${wie}</div><div class="cnt">${cnt}</div><div class="picks">${Array.from({length:n},(_,i)=>sel(i+1)).join('')}${!n&&canEditSlots?'<span class="muted" style="font-size:12px;align-self:center">niet nodig</span>':''}${blocked.length?`<div class="muted" style="font-size:12px;flex-basis:100%">Beschikbaar, nog niet gescreend voor ${esc(fmtRol(rol))}: ${blocked.map(esc).join(', ')}</div>`:''}</div></div>`;}).join('');
}

function viewIndeling(){
  const labels=myLabels();const wks=D.weekends.filter(w=>labels.includes(w.label));
  const w=wk(UI.weekendView)&&labels.includes(wk(UI.weekendView).label)?wk(UI.weekendView):wks[0];if(!w)return '<div class="band"></div><section class="panel"><h2>Indeling</h2><div class="body"><p class="muted">Geen weekenden.</p></div></section>';UI.weekendView=w.id;
  const ind=D.indeling[w.id]||{};const n=Object.values(w.slots).reduce((a,b)=>a+b,0);

    <p class="muted">${letOp(w)}${toew.length?'Leiding: '+esc(toew.join(', '))+'. ':''}Voor ${fmtVoor(w)}. ${zonderRollen(w.label)?'':'Links de rol, dan hoeveel je nodig hebt, dan per plek de beschikbare en gescreende crew.'}</p>${zonderRollen(w.label)?beschikbaarLijst(w):`<div>${slotsHtml(w,true,null,isKantoor())}</div>${exportKnop(w)}`}</div></section>`;
}

function viewAanmeldingen(){
  const scope=scopeWeekends();
  if(!scope.length)return '<div class="band"></div><section class="panel"><h2>Aanmeldingen</h2><div class="body"><p class="muted">Je hebt geen toewijzing.</p></div></section>';
  // groepeer per weekend
  const byW={};scope.forEach(s=>{(byW[s.w.id]=byW[s.w.id]||{w:s.w,rollen:new Set(),alles:false,functies:new Set()});if(s.rol)byW[s.w.id].rollen.add(s.rol);else byW[s.w.id].alles=true;byW[s.w.id].functies.add(s.functie);});
  const items=Object.values(byW).sort((a,b)=>(a.w.start_datum||'').localeCompare(b.w.start_datum||''));
  const cur=items.find(x=>x.w.id===UI.aanmeldView)||items[0];UI.aanmeldView=cur.w.id;
  const kies=items.length>1?`<div class="tools" style="margin-top:16px"><label for="amSel" class="muted">Jouw weekend:</label><select id="amSel">${items.map(x=>`<option value="${x.w.id}" ${x.w.id===cur.w.id?'selected':''}>${esc(lbl(x.w.label).naam)} · ${esc(x.w.naam)} (${esc(x.w.datum)}) · ${esc(fmtRollen([...x.functies]))}</option>`).join('')}</select></div>`:'';
  return kies+[cur].map(({w,rollen,alles,functies})=>{
    const rolFilter=alles?null:[...rollen];
    const canEdit=M.rollen.some(r=>magIndelen(w,r));const isPL=functies.has('PL');const mijnRollen=M.rollen.filter(r=>magIndelen(w,r));
    const av=crewUsers().filter(c=>wkPastBij(w,c)&&isAvail(c.id,w.id)&&(!rolFilter||approvedRoles(c.id,w.label).some(r=>rolFilter.includes(r))||wil(c.id,w.label).some(r=>rolFilter.includes(r))));
    const list=av.map(c=>{const i=intakeOf(c.id,w.label);const roles=approvedRoles(c.id,w.label).filter(r=>!rolFilter||rolFilter.includes(r));
      return `<tr><td class="name ${timesChosen(c.id)>MAX_OK?'over':''}" title="${esc(overTxt(c.id))}">${esc(c.naam)}${timesChosen(c.id)?` <span class="muted" style="font-weight:400">${timesChosen(c.id)}x</span>`:''}</td><td>${roles.length?esc(fmtRollen(roles)):'<span class="muted">nog niet gescreend</span>'}</td><td>${esc(fmtErv(i?.ervaring))}</td><td>${esc(i?.toelichting||'')}</td></tr>`;}).join('');
    return `<div class="band"></div><section class="panel"><h2>${esc(w.naam)} <span class="muted" style="font-size:14px;text-transform:none;letter-spacing:0">${esc(w.datum)} · jij: ${esc(fmtRollen([...functies]))}${rolFilter?' · alleen '+esc(fmtRollen(rolFilter)):''}</span></h2><div class="body">
      ${letOp(w)?`<p class="muted">${letOp(w)}</p>`:''}
      ${zonderRollen(w.label)?beschikbaarLijst(w):`<h3 style="margin-top:8px">Beschikbaar</h3>
      <div class="tw"><table><thead><tr><th>Naam</th><th>Gescreende rollen</th><th>Ervaring</th><th>Opmerkingen</th></tr></thead><tbody>${list||'<tr><td colspan="4" class="muted">Nog niemand beschikbaar.</td></tr>'}</tbody></table></div>`}
      ${zonderRollen(w.label)?'':`<h3 style="margin-top:16px">${isPL?'Indeling (jij bent PL): kies per rol hoeveel je nodig hebt en wie':canEdit?`Indeling: jij deelt ${esc(fmtRollen(mijnRollen))} in`:'Indeling'}</h3><div>${slotsHtml(w,canEdit,rolFilter&&rolFilter.length===1?rolFilter[0]:null,magSlots(w))}</div>${isPL?exportKnop(w):''}`}
    </div></section>`;
  }).join('');
}

function viewExport(){

function parseSlots(str){const slots={};(str||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const [r,n]=x.split(':').map(y=>y.trim());if(M.rollen.includes(r)&&+n>0)slots[r]=+n;else toast(`Onbekende rol of aantal: ${x}`);});return slots;}
const slotsStr=s=>Object.entries(s||{}).map(([r,n])=>`${r}:${n}`).join(', ');

/* Voortgang per weekend voor bewegingsleiders en kantoor: beschikbaar, kiesbaar, ingedeeld/plekken, open screenings. */
function voortgangData(){
  const labels=myLabels();
  return D.weekends.filter(w=>labels.includes(w.label)).sort((a,b)=>(a.start_datum||'').localeCompare(b.start_datum||'')).map(w=>{
    const crew=crewUsers().filter(c=>wkPastBij(w,c)&&isAvail(c.id,w.id));
    const kies=zonderRollen(w.label)?crew:crew.filter(c=>approvedRoles(c.id,w.label).length);
    const open=zonderRollen(w.label)?0:new Set(crew.filter(c=>G(c.id,w.label).some(g=>g.status==='voorgesteld')).map(c=>c.id)).size;
    const plekken=zonderRollen(w.label)?0:Object.values(w.slots||{}).reduce((a,b)=>a+b,0);
    const ingedeeld=Object.values(D.indeling[w.id]||{}).filter(Boolean).length;
    const pl=D.toewijzingen.filter(t=>t.soort==='weekend'&&t.weekend===w.id&&t.functie==='PL').map(t=>user(t.user)?.naam).filter(Boolean);
    return {w,beschikbaar:crew.length,kiesbaar:kies.length,open,plekken,ingedeeld,pl};
  });
}
function viewVoortgang(){
  const rows=voortgangData();
  const bar=(n,t)=>{const p=t?Math.min(100,Math.round(n/t*100)):0;return `<div class="bar"><i style="width:${p}%;background:${p>=100?'var(--ok)':p>=50?'var(--warn)':'var(--accent)'}"></i></div><span class="muted" style="font-size:12px">${n}/${t}</span>`;};
  const tot={besch:0,open:0,ingedeeld:0,plekken:0};rows.forEach(r=>{tot.open+=r.open;tot.ingedeeld+=r.ingedeeld;tot.plekken+=r.plekken;});
  const crewMet=new Set(rows.flatMap(r=>crewUsers().filter(c=>wkPastBij(r.w,c)&&isAvail(c.id,r.w.id)).map(c=>c.id))).size;
  const klaar=rows.filter(r=>r.plekken&&r.ingedeeld>=r.plekken).length;
  const scope=isLeider()?M.labels.flatMap(l=>[l.leider_m===me.id?l.naam+' (mannen)':null,l.leider_v===me.id?l.naam+' (vrouwen)':null]).filter(Boolean).join(', '):'alle labels';
  return `<div class="band"></div><section class="panel"><h2>Voortgang</h2><div class="body">
    <p class="muted">Per weekend binnen ${esc(scope)}: hoeveel crew beschikbaar is, hoeveel daarvan kiesbaar is voor de PL, hoe ver de indeling is en hoeveel screenings nog open staan. Deadline invullen: ${DEADLINE}.</p>
    <div class="stats">
      <div class="stat"><div class="v">${crewMet}</div><div class="l">crewleden beschikbaar gesteld</div></div>
      <div class="stat"><div class="v ${tot.open?'over':''}">${tot.open}</div><div class="l">crewleden wachten op screening</div></div>
      <div class="stat"><div class="v">${tot.ingedeeld}/${tot.plekken}</div><div class="l">plekken ingedeeld</div></div>
      <div class="stat"><div class="v">${klaar}/${rows.filter(r=>r.plekken).length}</div><div class="l">weekenden volledig ingedeeld</div></div>
    </div>
    <div class="tw"><table><thead><tr><th>Weekend</th><th>PL</th><th class="right">Beschikbaar</th><th class="right">Kiesbaar</th><th>Ingedeeld</th><th class="right">Open screening</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="name">${esc(r.w.naam)}<div class="muted" style="font-weight:400;font-size:12px">${esc(lbl(r.w.label).naam)} · ${esc(r.w.datum)}</div></td><td>${r.pl.length?esc(r.pl.join(', ')):'<span class="muted">nog geen PL</span>'}</td><td class="right">${r.beschikbaar}</td><td class="right">${zonderRollen(r.w.label)?'<span class="muted">n.v.t.</span>':r.kiesbaar}</td><td style="min-width:140px">${zonderRollen(r.w.label)?'<span class="muted">geen indeling</span>':bar(r.ingedeeld,r.plekken)}</td><td class="right ${r.open?'over':''}">${zonderRollen(r.w.label)?'':r.open}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Geen weekenden.</td></tr>'}
    </tbody></table></div>
    <p class="note" style="margin-top:12px">Open screening = crewleden die beschikbaar zijn voor dit weekend en nog een rol hebben die op jouw beoordeling wacht. Zolang dat getal niet 0 is, mist de PL mogelijk kandidaten.</p>
  </div></section>`;
}
function viewVerdeling(){
  const V=D.verdeling||crewUsers().map(c=>({id:c.id,naam:c.naam,n:timesChosen(c.id),waar:chosenDetail(c.id),beschikbaar:D.weekends.filter(w=>isAvail(c.id,w.id)).map(w=>({naam:w.naam,label:w.label,rollen:approvedRoles(c.id,w.label)}))}));
  const metBesch=V.filter(v=>v.beschikbaar.length);
  const gekozen=metBesch.filter(v=>v.n>0).sort((a,b)=>b.n-a.n||a.naam.localeCompare(b.naam));
  const nul=metBesch.filter(v=>v.n===0).sort((a,b)=>b.beschikbaar.length-a.beschikbaar.length);
  const row=v=>`<tr><td class="name ${v.n>MAX_OK?'over':''}">${esc(v.naam)}</td><td class="right ${v.n>MAX_OK?'over':''}">${v.n}</td><td>${esc(fmtRolStr(v.waar.join(', ')))}</td><td class="right">${v.beschikbaar.length}</td></tr>`;
  const nulRow=v=>`<tr><td class="name">${esc(v.naam)}</td><td>${v.beschikbaar.map(b=>`${esc(b.naam)}${b.rollen.length?' <span class="muted">('+esc(fmtRollen(b.rollen))+')</span>':' <span class="muted">(nog niet gescreend)</span>'}`).join('<br>')}</td></tr>`;
  return `<div class="band"></div><section class="panel"><h2>Verdeling</h2><div class="body">
    <p class="muted">Hoe vaak is iedereen gekozen, over alle weekenden heen. Vaker dan ${MAX_OK}x staat oranje. Doel: niemand 10x, niemand 0x.</p>
    <div class="stats"><div class="stat"><div class="v">${metBesch.length}</div><div class="l">beschikbaar gesteld</div></div><div class="stat"><div class="v">${gekozen.length}</div><div class="l">minstens 1x gekozen</div></div><div class="stat"><div class="v ${gekozen.filter(v=>v.n>MAX_OK).length?'over':''}">${gekozen.filter(v=>v.n>MAX_OK).length}</div><div class="l">vaker dan ${MAX_OK}x</div></div><div class="stat"><div class="v">${nul.length}</div><div class="l">nog 0x gekozen</div></div></div>
    <div class="tw"><table><thead><tr><th>Naam</th><th class="right">Gekozen</th><th>Waar</th><th class="right">Beschikbaar voor</th></tr></thead><tbody>${gekozen.map(row).join('')||'<tr><td colspan="4" class="muted">Nog niemand ingedeeld.</td></tr>'}</tbody></table></div>
  </div></section>
  <div class="band"></div><section class="panel"><h2>Nog 0x gekozen</h2><div class="body">
    <p class="muted">Wel beschikbaar, nog nergens ingedeeld. Tussen haakjes de gescreende rollen voor dat label.</p>
    <div class="tw"><table><thead><tr><th>Naam</th><th>Beschikbaar voor</th></tr></thead><tbody>${nul.map(nulRow).join('')||'<tr><td colspan="2" class="muted">Iedereen die beschikbaar is, is minstens één keer gekozen.</td></tr>'}</tbody></table></div>
  </div></section>`;

function viewModel(){
  return `<div class="band"></div><section class="panel model"><h2>Datamodel en regels</h2><div class="body">

      <dt>medisch</dt><dd>per crewlid: medische bijzonderheden + toelichting, voedselallergie + toelichting, ICE-contact. Alleen eigenaar en kantoor. Vooraf in te laden via <code>medisch_pending</code>; is het bekend, dan slaat de app de vragen over.</dd>
      <dt>labels</dt><dd>4M, 4Family, Arise, LIFE, Promo, met doelgroep (4M alleen M, Arise alleen V) en bewegingsleider per geslacht: leider_m / leider_v. 4Family: mannen → Wouter, vrouwen → Nadine. Common Ground valt onder 4Family.</dd>
      <dt>rollen</dt><dd>vaste lijst, geen vrije tekst.</dd>

      <dt>goedkeuringen</dt><dd>crew × label × rol: status, bron (vervuld / voorkeur / kantoor), door, datum, interne notitie. Voorkeur-niet-vervuld = potentieel.</dd>
      <dt>weekends</dt><dd>label, naam, datum, startdatum, plekken per rol, startdag, crewmeeting, terugkomavond. Beheer onder Weekenden; de bijeenkomsten staan bij het weekend in de uitvraag. Beschikbaar voor het weekend = ook voor die dagen.</dd>
      <dt>beschikbaarheid</dt><dd>crew × weekend, vrij in te vullen voor gekozen labels.</dd>
      <dt>indeling</dt><dd>weekend × rol × plek → crew, alleen gescreend + beschikbaar (databaseregel).</dd>
      <dt>toewijzingen</dt><dd>persoon × functie × bereik (weekend / label / rol+label). Bepaalt wie buiten kantoor en bewegingsleiders aanmeldingen ziet: PL/GL/FL van een weekend, coördinatoren van een rol. PL van een weekend mag indelen en het aantal plekken per rol van zijn weekend aanpassen.</dd>
    </dl>
    <h3 style="margin-top:18px">Regels</h3>
    <ol>
      <li>Crew doorloopt vier stappen in vaste volgorde: gegevens → medisch → inzet → beschikbaarheid; een stap gaat pas open als de vorige is afgerond (ook afgedwongen in de database). Intake en beschikbaarheid zijn open voor iedereen binnen de doelgroep. Screening door de bewegingsleider (per label en geslacht) is de filter: alleen gescreend + beschikbaar komt in de keuzelijst.</li>

      <li>Export bevat geen contactgegevens, notities of afgewezen rollen.</li>

}

function brandFor(u){
  if(!u)return '';
  if(rollenVan(u).includes('kantoor'))return '4M';
  if(rollenVan(u).includes('leider')){const ls=M.labels.filter(l=>l.leider_m===u.id||l.leider_v===u.id).map(l=>l.id);if(ls.includes('4M'))return '4M';if(ls.includes('AR'))return 'AR';if(ls.length&&ls.every(l=>l==='LI'))return 'LI';}
  if(rollenVan(u).includes('crew'))return u.geslacht==='M'?'4M':u.geslacht==='V'?'AR':'4M';
  return '4M';
}

    me=user(saved.who)||M.users[0];UI.step=saved.step||null;await refresh();return;}
  document.getElementById('subline').textContent='Coalition58 · crewplanning';
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const {data:{session}}=await sb.auth.getSession();
  document.documentElement.setAttribute('data-brand','4M');setLogo('C58');document.getElementById('heroTitle').textContent='Inloggen';
  if(!session){document.getElementById('userbox').hidden=true;document.getElementById('heroTitle').textContent='Beschikbaarheid CREW 2027';document.getElementById('main').innerHTML=`<div class="intro">Welkom bij de crewplanning 2027 van <b>4M, 4Family, Arise, LIFE en Promo (Events)</b>. Hier geef je in vier stappen je gegevens, je inzet en je beschikbaarheid per weekend door. Daarna gaan de bewegingsleiders en projectleiders aan de slag met de planning. Invullen kan tot <b>${DEADLINE}</b>; aanpassen kan daarna nog steeds door opnieuw in te loggen.</div><div class="band"></div><section class="panel login"><h2>Inloggen</h2><div class="body">
      <p class="muted">Je krijgt een inloglink via de mail, een wachtwoord is er niet. Nieuw? Vul gewoon je mailadres in, daarmee maak je direct je account aan.</p>
      <div class="row"><label class="lab" for="email">E-mailadres</label><div class="ctl"><input type="email" id="email" placeholder="je@mail.nl" autocomplete="email"></div></div>
      <div class="tools"><button class="primary" id="sendLink">Stuur inloglink</button><span class="muted" id="loginMsg"></span></div></div></section>`;
    const send=async()=>{const em=document.getElementById('email').value.trim();if(!em)return;document.getElementById('loginMsg').textContent='Versturen…';
      const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}});
      document.getElementById('loginMsg').textContent=error?'Lukt niet: '+error.message:'Link verstuurd. Check je mail (ook spam).';};
    document.getElementById('sendLink').onclick=send;document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')send();});return;}
  document.getElementById('userbox').hidden=false;
  db=SupabaseStore(sb);M=await db.init();
  me=user(session.user.id);
  if(!me){document.getElementById('userbox').hidden=true;document.getElementById('main').innerHTML=`<div class="band"></div><section class="panel login"><h2>Geen profiel</h2><div class="body"><p class="muted">Je bent ingelogd als ${esc(session.user.email)}, maar dit adres staat nog niet in de lijst van kantoor. Vraag kantoor om je toe te voegen en log daarna opnieuw in.</p><div class="tools"><button id="logout">Uitloggen</button></div></div></section>`;return;}
  await refresh();
}
boot();
</script>
</body></html>
